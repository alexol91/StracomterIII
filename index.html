<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Stracomter III</title>
  <style>
    /* Estilos mínimos para que la página no parpadee antes de cargar el resto (src/ui/styles.css). */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0b0e14; color: #fff;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #ctl { position: fixed; inset: 0; z-index: 5; }
    #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  </style>
</head>
<body>
  <!-- Escena 3D -->
  <canvas id="game"></canvas>
  <!-- Capa propia de los mandos táctiles (la rellena el módulo de controles) -->
  <div id="ctl"></div>
  <!-- Interfaz superpuesta: menús, HUD y consola -->
  <div id="ui"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
